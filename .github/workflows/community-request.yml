name: "🌟 Community Feature Request"

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: community-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  community-request:
    if: github.event.issue.user.login != 'github-actions[bot]' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_TOKEN }}
          
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm install
        
      - name: Set Issue Number
        run: echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
        
      - name: Run AI Responder Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.AGENT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node agents/responder.mjs --issue $ISSUE_NUMBER
        
      - name: Log success
        run: echo "Community request handled successfully!"
