name: "🎯 Plan Project"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'PROJECT_SPEC.md'
  workflow_dispatch:

concurrency:
  group: "plan-project"
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_TOKEN }}
          
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run Planner Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.AGENT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node agents/planner.mjs
        
      - name: Log success
        run: echo "Planner agent completed successfully!"
